name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build, check and package
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: XingyuConnect-Windows
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          retention-days: 14
